:root{--warm:#FFC891;--ink:#F4F1EB;--dim:rgba(244,241,235,.72);--bg:#000}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}
#gl{position:absolute;inset:0;width:1920px;height:1080px;display:block}
#ui{position:absolute;inset:0;pointer-events:none;color:var(--ink);font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
#ui *{box-sizing:border-box}
.lb{position:absolute;left:0;right:0;background:#000;height:0;z-index:20}.lb.top{top:0}.lb.bot{bottom:0}
.fade{position:absolute;inset:0;background:#000;opacity:0;z-index:30}
.flashw{position:absolute;inset:0;background:#fff7ec;opacity:0;z-index:29;mix-blend-mode:screen}
.svgwrap{position:absolute;inset:0;z-index:6}
.svgwrap svg{position:absolute;inset:0}
.svt{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.14em;fill:rgba(244,241,235,.85)}

.flare{position:absolute;left:0;top:0;width:0;height:0;z-index:4;mix-blend-mode:screen}
.flare>div{position:absolute;left:0;top:0}
.flare .streak{width:1700px;height:5px;margin:-2.5px 0 0 -850px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,240,215,.95) 0%,rgba(255,196,140,.55) 12%,rgba(140,170,255,.18) 45%,rgba(120,150,255,0) 70%)}
.flare .s2{width:900px;height:22px;margin:-11px 0 0 -450px;opacity:.5;filter:blur(6px)}
.flare .core{width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,205,.55) 0%,rgba(255,190,130,.18) 35%,rgba(255,170,110,0) 70%)}
.flare .ghost{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:1px solid rgba(170,190,255,.12);background:radial-gradient(circle,rgba(150,175,255,.08),rgba(150,175,255,0) 70%)}
.flare .g2{width:140px;height:140px;margin:-70px 0 0 -70px;background:radial-gradient(circle,rgba(255,180,120,.06),rgba(255,180,120,0) 70%);border-color:rgba(255,190,140,.08)}

.bug{position:absolute;right:120px;top:64px;z-index:8;display:flex;gap:14px;align-items:baseline;opacity:0}
.bug b{font-weight:800;font-variation-settings:'wdth' 125;font-size:19px;letter-spacing:.28em}
.bug span{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.3em;color:var(--dim)}

.soft{position:absolute;text-align:center;font-weight:300;font-variation-settings:'wdth' 112;letter-spacing:.06em;z-index:10;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.soft span{display:inline-block}

.card{position:absolute;z-index:10;max-width:1000px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.card.right{text-align:right}
.eb{display:flex;align-items:center;gap:16px;margin-bottom:26px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:19px;letter-spacing:.26em;color:var(--warm)}
.card.right .eb{justify-content:flex-end}
.eb .rule{display:inline-block;width:56px;height:2px;background:var(--warm);transform-origin:0 50%}
.hd{font-weight:850;font-variation-settings:'wdth' 125;line-height:.9;letter-spacing:-.012em;text-transform:none}
.hd .ln{display:block;overflow:hidden;padding:0 .04em .06em 0;margin-bottom:-.06em}
.hd .in{display:inline-block;will-change:transform}
.sb{margin-top:26px;font-size:31px;font-weight:400;font-variation-settings:'wdth' 100;color:var(--dim);line-height:1.3;letter-spacing:.005em}
.fn{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.12em;color:rgba(244,241,235,.5);text-transform:uppercase}

.lumen{position:absolute;left:120px;bottom:140px;z-index:10}
.lumen .big{display:flex;align-items:flex-end;gap:28px;transform-origin:0 100%;font-weight:900;font-variation-settings:'wdth' 125;line-height:.8}
.lumen .num{font-size:260px;letter-spacing:inherit;font-feature-settings:'tnum'}
.lumen .unit{font-size:64px;letter-spacing:.12em;padding-bottom:12px;color:var(--warm)}
.lumen .sb{margin-top:30px}

.rise{position:absolute;right:330px;top:430px;z-index:10;text-align:right}
.rise .lbl{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.3em;color:var(--warm)}
.rise .val{margin-top:10px;font-weight:850;font-variation-settings:'wdth' 125;font-size:130px;line-height:.9;font-feature-settings:'tnum'}
.rise .val .u{font-size:44px;margin-left:12px;color:var(--dim)}
.rise .stage{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.24em;color:var(--dim)}

.co{position:absolute;z-index:10;display:flex;flex-direction:column;gap:6px}
.co b{font-weight:850;font-variation-settings:'wdth' 125;font-size:40px;line-height:1}
.co span{font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.24em;color:var(--warm)}
.htag{position:absolute;z-index:10;display:flex;flex-direction:column;gap:4px}
.htag b{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:18px;letter-spacing:.14em}
.htag span{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.24em;color:var(--dim)}
.hread{position:absolute;z-index:10;width:170px;text-align:right;font-weight:850;font-variation-settings:'wdth' 125;font-size:56px;line-height:1;font-feature-settings:'tnum'}
.hread .u{font-size:22px;margin-left:8px;color:var(--warm)}

.modes{position:absolute;left:120px;bottom:130px;z-index:10}
.modes .read{font-weight:900;font-variation-settings:'wdth' 125;font-size:150px;line-height:.85;font-feature-settings:'tnum'}
.modes .read .u{font-size:44px;margin-left:14px;color:var(--warm);letter-spacing:.12em}
.modes .segs{display:flex;gap:10px;margin-top:30px}
.modes .sg{width:170px}
.modes .sg i{display:block;height:6px;background:var(--warm);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 18px rgba(255,200,145,.6)}
.modes .sg{border-top:6px solid rgba(255,255,255,.14);position:relative}
.modes .sg i{position:absolute;left:0;right:0;top:-6px}
.modes .sg b{display:block;margin-top:14px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:17px;letter-spacing:.24em;color:rgba(244,241,235,.45)}
.modes .sg.on b{color:var(--ink)}

.kel{position:absolute;left:120px;bottom:150px;width:760px;z-index:10}
.kel .track{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,#ffad5e,#ffd4a6 40%,#f4f1eb 65%,#cfe0ff)}
.kel .knob{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.18),0 0 30px rgba(255,220,180,.7)}
.kel .knob span{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-weight:600;font-size:22px;letter-spacing:.1em;white-space:nowrap}
.kel .ends{display:flex;justify-content:space-between;margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.22em;color:var(--dim)}

.pow{position:absolute;left:120px;bottom:150px;width:820px;z-index:10;display:flex;flex-direction:column;gap:26px}
.pow .row{display:grid;grid-template-columns:200px 1fr 120px;align-items:center;gap:20px;font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.2em}
.pow .row b{font-weight:500;color:var(--dim)}
.pow .row span{text-align:right;font-weight:600;font-size:20px}
.pow .bar{height:10px;background:rgba(255,255,255,.12);position:relative}
.pow .bar i{position:absolute;inset:0;background:var(--warm);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 20px rgba(255,200,145,.5)}

.word{position:absolute;left:120px;bottom:140px;z-index:10}
.word .w{overflow:hidden;font-weight:900;font-variation-settings:'wdth' 125;font-size:230px;line-height:.86;padding-bottom:.04em}
.word .w span{display:inline-block}
.word .loc{display:flex;gap:26px;margin-top:22px;font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.24em}
.word .loc b{font-weight:600;color:var(--warm)}
.word .loc span{color:var(--dim)}
.ticks{position:absolute;right:120px;bottom:150px;display:flex;gap:10px;z-index:10}
.ticks i{width:44px;height:4px;background:rgba(255,255,255,.2)}
.ticks i.on{background:var(--warm)}

.end{position:absolute;left:960px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;z-index:10}
.end .brand{font-weight:800;font-variation-settings:'wdth' 125;font-size:30px;letter-spacing:.42em;margin-bottom:22px}
.end .name{overflow:hidden;font-weight:900;font-variation-settings:'wdth' 125;font-size:128px;line-height:.9;padding-bottom:.04em}
.end .name span{display:inline-block}
.end .kind{margin-top:22px;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.42em;color:var(--warm)}
.end .erule{margin:40px 0 34px;width:120px;height:2px;background:rgba(244,241,235,.5);transform-origin:0 50%}
.end .tag{font-size:50px;font-weight:350;font-variation-settings:'wdth' 100;letter-spacing:.005em}
.end .url{margin-top:40px;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.24em;color:var(--dim)}

/* player chrome, hidden during capture */
#chrome{position:fixed;left:0;right:0;bottom:0;padding:18px 24px;display:flex;align-items:center;gap:16px;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .3s;font:14px/1 system-ui,sans-serif;color:#fff}
body:not(.playing) #chrome,#chrome:hover{opacity:1}
#play{appearance:none;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit}
