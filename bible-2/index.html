<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen" />
    <meta name="theme-color" content="#1b1430" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2224%22 fill=%22none%22 stroke=%22%23ffd447%22 stroke-width=%228%22/%3E%3C/svg%3E" />
    <title>Bible 2</title>
    <style>
      :root { --bg: #1b1430; --ink: #f6e7c1; color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: var(--bg); overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      /* keep the playfield clear of notches and home bars */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: var(--bg); color: var(--ink);
        font: 700 20px/1.4 Georgia, 'Times New Roman', serif;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      #rotate span { display: block; font-size: 56px; margin-bottom: 12px; }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div><span>&#8635;</span>Turn your phone sideways.<br />The unicorn needs room to run.</div></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
